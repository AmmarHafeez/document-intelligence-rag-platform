[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence-rag-platform"
version = "0.1.0"
description = "Local-first document retrieval baseline with ingestion, chunking, API serving, and evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "joblib>=1.3",
    "pydantic>=2.6",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
document-rag = "document_intelligence_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
